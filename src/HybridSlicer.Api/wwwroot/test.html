<!DOCTYPE html>
<html>
<head><title>Support Test</title></head>
<body style="margin:0;background:#111">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111827);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 5000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.position.set(1,2,3);
scene.add(sun);
scene.add(new THREE.GridHelper(200, 20, 0x333, 0x222));

function swapAndFix(geometry) {
  const pos = geometry.getAttribute('position');
  for(let i=0;i<pos.count;i++){
    const y=pos.getY(i), z=pos.getZ(i);
    pos.setY(i,z); pos.setZ(i,y);
  }
  for(let i=0;i<pos.count;i+=3){
    const x1=pos.getX(i+1),y1=pos.getY(i+1),z1=pos.getZ(i+1);
    const x2=pos.getX(i+2),y2=pos.getY(i+2),z2=pos.getZ(i+2);
    pos.setXYZ(i+1,x2,y2,z2);
    pos.setXYZ(i+2,x1,y1,z1);
  }
  pos.needsUpdate = true;
  geometry.computeVertexNormals();
}

const loader = new STLLoader();

// Load model
loader.load('/test-model.stl', (geometry) => {
  swapAndFix(geometry);
  geometry.center();
  geometry.computeBoundingBox();
  const size = new THREE.Vector3();
  geometry.boundingBox.getSize(size);
  geometry.translate(0, size.y/2, 0);

  const mesh = new THREE.Mesh(geometry, new THREE.MeshPhongMaterial({
    color: 0x3b82f6, specular: 0x222222, shininess: 40, side: THREE.DoubleSide
  }));
  scene.add(mesh);

  const d = Math.max(size.x, size.y, size.z) * 1.7;
  camera.position.set(d, d*0.7, d);
  camera.lookAt(0, size.y/2, 0);
  controls.target.set(0, size.y/2, 0);
  controls.update();

  document.getElementById('info').textContent = 
    'Model: '+size.x.toFixed(1)+'x'+size.y.toFixed(1)+'x'+size.z.toFixed(1)+'mm';

  // Load supports
  loader.load('/test-supports.stl', (supGeo) => {
    swapAndFix(supGeo);
    // No center/translate — supports are already in backend-centered space
    // which after Y/Z swap matches the model's centered space
    const supMesh = new THREE.Mesh(supGeo, new THREE.MeshPhongMaterial({
      color: 0x14b8a6, specular: 0x444444, shininess: 50, 
      side: THREE.DoubleSide, transparent: true, opacity: 0.8
    }));
    scene.add(supMesh);
    document.getElementById('info').textContent += ' | Supports loaded';
  });
});

function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);}
animate();
</script>
<div id="info" style="position:absolute;top:10px;left:10px;color:white;font:14px monospace">Loading...</div>
</body>
</html>
