name: CI — Build + Test Gate

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore NuGet packages
        run: dotnet restore HybridSlicer.sln

      - name: Build backend
        run: dotnet build HybridSlicer.sln --no-restore --configuration Release

      - name: Run backend tests
        run: dotnet test HybridSlicer.sln --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
